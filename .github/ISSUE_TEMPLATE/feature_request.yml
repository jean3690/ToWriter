name: 功能请求
description: 建议一个新功能或改进
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 你想解决什么问题？
      description: 描述你遇到的痛点或想完成的事情。
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 你期望的方案
      description: 描述你希望看到的行为或交互。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 你还考虑过其他实现方式吗？
  - type: dropdown
    id: area
    attributes:
      label: 相关模块
      description: 该功能主要影响哪个部分？
      options:
        - 编辑器 / 写作体验
        - AI 功能
        - 插件系统 / 插件市场
        - 界面 / 主题 / i18n
        - 其他
